version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: renewals_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renewals_prod}
      POSTGRES_USER: ${POSTGRES_USER:-renewals_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renewals_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renewals_user} -d ${POSTGRES_DB:-renewals_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - renewals_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: renewals_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-renewals_user}:${POSTGRES_PASSWORD:-renewals_secret}@db:5432/${POSTGRES_DB:-renewals_prod}
      SECRET_KEY: ${SECRET_KEY:-default_secret_key_change_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:80"]}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - temp_data:/app/scratch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - renewals_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: renewals_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - renewals_net

volumes:
  postgres_data:
  uploads_data:
  temp_data:

networks:
  renewals_net:
    driver: bridge
